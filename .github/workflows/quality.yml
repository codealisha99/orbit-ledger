name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: quality
          POSTGRES_DB: actioncd_quality_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quality:quality@localhost:5432/actioncd_quality_ci
      JWT_SECRET: ci-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run prisma generate
      - run: bun run prisma migrate deploy
      - run: bun run check-types
      - run: bun run --cwd apps/Frontend lint
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
